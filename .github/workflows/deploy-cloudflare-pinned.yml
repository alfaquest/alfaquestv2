name: Deploy to Cloudflare (pinned wrangler)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run game test suite
        run: npm run test:games

      - name: Publish Worker (pinned wrangler)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          npm exec --yes wrangler@4.77.0 -- deploy --config wrangler.worker.toml

      - name: Publish Pages (pinned wrangler)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npm exec --yes wrangler@4.77.0 -- pages deploy . --project-name=alfaquest-pages --branch "npx.cmd wrangler pages project create alfaquest-pages --production-branch main"
