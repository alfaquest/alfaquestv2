<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Choose a Category | alfaword.games</title>
  <style>
    :root{color-scheme:dark;--bg:#071023;--muted:#9aa6b2;--blue:#8de6ff}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;padding:28px;font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;background:linear-gradient(180deg,#071023,#071827);color:#e6eef6}
    main{max-width:680px;margin:0 auto}
    h1{margin:0 0 8px;color:#cbe7ff}
    .intro{margin:0 0 20px;color:var(--muted)}
    .categories{display:grid;gap:14px}
    .card{padding:18px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.03)}
    .card h2{margin:0 0 6px;color:#cbe7ff}
    .card p{margin:0 0 12px;color:var(--muted)}
    .button{display:inline-block;padding:11px 16px;border:1px solid rgba(149,205,255,.55);border-radius:10px;background:linear-gradient(145deg,#183a87,#0f2459 58%,#0a183f);color:#f4fbff;text-decoration:none;font-weight:700}
    .back{display:inline-block;margin-top:22px;color:#7dd3fc;text-decoration:none}
    .error{padding:14px;border:1px solid rgba(255,92,108,.45);border-radius:10px;color:#fecaca;background:rgba(127,29,29,.22)}
  </style>
</head>
<body>
  <main>
    <h1>Choose a category</h1>
    <p class="intro">Game: <strong id="gameName"></strong></p>
    <section id="categoryList" class="categories" aria-label="Available categories"></section>
    <a class="back" href="index.html">&larr; Choose another game</a>
  </main>
  <script src="scripts/starfield-bg.js"></script>
  <script type="module">
    import { categoriesForMode } from './shared/categories.js';

    const gamePages = Object.freeze({
      classic: { label: 'Alfaquest Classic', page: 'alfaquest.html' },
      fill: { label: 'Alfaquest Fill', page: 'alfafillnormal.html' },
      easy: { label: 'Alfaquest Easy', page: 'alfafilleasy.html' },
      strict: { label: 'Alfaquest Strict', page: 'alfafillhard.html' }
    });
    const mode = new URLSearchParams(window.location.search).get('mode');
    const game = gamePages[mode];
    const list = document.getElementById('categoryList');
    const name = document.getElementById('gameName');

    if (!game) {
      name.textContent = 'Unknown game';
      list.innerHTML = '<p class="error">Choose a valid game before selecting a category.</p>';
    } else {
      name.textContent = game.label;
      const categories = categoriesForMode(mode);
      if (categories.length === 0) {
        list.innerHTML = '<p class="error">No compatible categories are currently available.</p>';
      } else {
        for (const category of categories) {
          const card = document.createElement('article');
          card.className = 'card';
          const title = document.createElement('h2');
          title.textContent = category.label;
          const summary = document.createElement('p');
          summary.textContent = `${category.entries.length} accepted ${category.plural}; ${category.startingLetters.length} available starting letters.`;
          const link = document.createElement('a');
          link.className = 'button';
          link.href = `${game.page}?category=${encodeURIComponent(category.id)}`;
          link.textContent = `Play with ${category.shortLabel}`;
          card.append(title, summary, link);
          list.appendChild(card);
        }
      }
    }
  </script>
</body>
</html>
